# GitHub Packages Configuration
# This file documents the package publishing configuration for GHCR

name: pi-saia-plugin

packages:
  docker:
    # Docker image on GitHub Container Registry
    name: ghcr.io/graphwiz-ai/pi-saia-plugin
    description: SAIA (GWDG Chat AI) plugin for pi coding agent
    
    # Image variants
    variants:
      - name: latest
        description: Production-ready image with runtime dependencies
        dockerfile: Dockerfile
        target: ""
        platforms: linux/amd64,linux/arm64
        
      - name: latest-dev
        description: Development image with all build tools
        dockerfile: Dockerfile
        target: builder
        platforms: linux/amd64,linux/arm64
        
      - name: v${VERSION}
        description: Version-specific production image
        dockerfile: Dockerfile
        target: ""
        platforms: linux/amd64,linux/arm64
        
    # Tags generated from Git refs
    tags:
      # Branch tags
      - type: branch
        pattern: main
        format: latest
        
      - type: branch
        pattern: develop
        format: develop
        
      - type: branch
        pattern: feature/*
        format: feature-{{branch}}
        
      # Semver tags
      - type: tag
        pattern: v(*)
        format: ${{1}}
        
      - type: tag
        pattern: v(*.*.*)
        format: ${{1}}
        
      - type: tag
        pattern: v(*.*)
        format: ${{1}}
        
      - type: tag
        pattern: v(*)
        format: v{{1}}-dev
        variant: latest-dev
        
      # SHA tags
      - type: sha
        format: sha-{{sha}}
        
    # Labels
    labels:
      - org.opencontainers.image.title=SAIA Plugin for pi Coding Agent
      - org.opencontainers.image.description=SAIA (GWDG Chat AI) plugin for pi coding agent — model config generator, profiles, caching, and skills
      - org.opencontainers.image.url=https://codeberg.org/graphwiz-ai/pi-saia-plugin
      - org.opencontainers.image.source=https://codeberg.org/graphwiz-ai/pi-saia-plugin
      - org.opencontainers.image.licenses=MIT
      - org.opencontainers.image.vendor=graphwiz-ai
      - org.opencontainers.image.authors=graphwiz-ai
      - maintainer=graphwiz-ai <graphwiz-ai@codeberg.org>

publishing:
  # When to publish
  on:
    push:
      branches: [main, master]
      tags: [v*]
    pull_request:
      branches: [main, master]
    workflow_dispatch: {}

  # Platforms to build for
  platforms: linux/amd64,linux/arm64

  # Build cache
  cache:
    enabled: true
    type: gha
    scope: ${{ matrix.variant }}

  # Security scanning
  security:
    scan: true
    tool: trivy
    severity: HIGH,CRITICAL
    format: sarif

# Dependencies
# These images are used in CI/CD workflows
dependencies:
  - image: node:24-alpine
    purpose: Base image for builds
    
  - image: python:3.11-alpine
    purpose: Mock API server
    
  - image: aquasecurity/trivy
    purpose: Security scanning

# Usage examples for users
usage:
  install:
    docker: pull ghcr.io/graphwiz-ai/pi-saia-plugin:latest
    
  development:
    docker: run -it --rm -v $(pwd):/app ghcr.io/graphwiz-ai/pi-saia-plugin:latest-dev sh
    
  production:
    docker: run -d -e SAIA_API_KEY=your_key ghcr.io/graphwiz-ai/pi-saia-plugin:latest

# Maintenance
maintenance:
  cleanup:
    # Remove old images (keep last 5)
    command: docker image prune -a --filter "label=org.opencontainers.image.title=SAIA Plugin for pi Coding Agent" --keep 5
    schedule: daily
    
  vulnerability_scan:
    command: docker scan ghcr.io/graphwiz-ai/pi-saia-plugin:latest
    schedule: weekly
    
  test_build:
    command: docker buildx build --platform linux/amd64,linux/arm64 -t test-image . --dry-run
    schedule: on-push
