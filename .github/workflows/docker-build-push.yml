name: Docker Build and Push

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - variant: production
            dockerfile: Dockerfile
            target: ""
            suffix: ""
          - variant: development
            dockerfile: Dockerfile
            target: builder
            suffix: "-dev"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=${{ matrix.suffix }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=SAIA Plugin for pi Coding Agent
            org.opencontainers.image.description=SAIA (GWDG Chat AI) plugin for pi coding agent — model register, profiles, and sills
            org.opencontainers.image.url=https://github.com/tobias-weiss-ai-xr/pi-saia-plugin
            org.opencontainers.image.source=https://github.com/tobias-weiss-ai-xr/pi-saia-plugin
            org.opencontainers.image.licenses=MIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}

  sandbox-test:
    name: Sandbox Environment Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image (native arch)
        run: docker build -t test-image .

      - name: Run smoke test
        run: |
          docker run --rm test-image sh -c '
            echo "=== Smoke Test ==="
            echo "1. user:              $(whoami)"
            test -f /home/pluginuser/app/src/saia.ts && echo "2. src/saia.ts:           OK"
            test -f /home/pluginuser/app/src/saia-memory.ts && echo "3. src/saia-memory.ts:     OK"
            test -f /home/pluginuser/app/src/generate-saia-config.sh && echo "4. generate script:       OK"
            test -f /home/pluginuser/app/schema/pi.schema.json && echo "5. schema:                OK"
            test -f /home/pluginuser/.config/pi/plugins/saia/saia.ts && echo "6. plugin saia.ts:        OK"
            test -f /home/pluginuser/.config/pi/plugins/saia/schema/pi.schema.json && echo "7. plugin schema:         OK"
            test -d /home/pluginuser/.config/pi/plugins/saia/.opencode/skills && echo "8. plugin skills dir:     OK"
            test -d /home/pluginuser/.cache/saia && echo "9. cache dir:              OK"
          '

      - name: Run TypeScript check
        run: |
          docker run --rm test-image sh -c '
            cd /home/pluginuser/app && npx tsc --noEmit --skipLibCheck 2>&1 && echo "TypeScript: OK"
          ' || echo "TypeScript check: warnings (non-blocking)"

  security-scan:
    name: Security Scan
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: local/saia-plugin:scan
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/saia-plugin:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
