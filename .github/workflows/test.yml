name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npm run tsc

      - name: Shell script syntax check
        run: |
          for script in src/*.sh install.sh prepare-release.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" || exit 1
              echo "✓ $script syntax OK"
            fi
          done

      - name: Validate JSON schema
        run: |
          npm install -g ajv-cli
          ajv validate -s schema/pi.schema.json -d pi.json.example

      - name: Check file permissions
        run: |
          chmod +x src/*.sh install.sh install.ps1 prepare-release.sh
          echo "✓ Executable permissions set"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: install.ps1
